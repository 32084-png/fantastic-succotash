        * {

        body {

        }
        .pixel-border {

        }
        .gold-border {

        }

        // Web Audio API Synthesizer
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            play(type) {
                if (!this.ctx) this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'attack') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.15);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'magic') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.linearRampToValueAtTime(1200, now + 0.25);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'heal') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.3);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'victory') {
                    const notes = [261, 329, 392, 523];
                    notes.forEach((freq, i) => {
                        const o = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        o.connect(g);
                        g.connect(this.ctx.destination);
                        o.frequency.setValueAtTime(freq, now + i * 0.1);
                        g.gain.setValueAtTime(0.15, now + i * 0.1);
                        g.gain.linearRampToValueAtTime(0.01, now + i * 0.1 + 0.15);
                        o.start(now + i * 0.1);
                        o.stop(now + i * 0.1 + 0.15);
                    });
                } else if (type === 'gameover') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(60, now + 0.5);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            }
        };

            { name: 'แอสตารอท (มังกรไฟ)', hp: 220, maxHp: 220, atk: 35, def: 12, exp: 120, gold: 120, drops: { dragonshell: 0.8, iron_ore: 0.8 }, svgType: 'dragon' }

            hp: 100,

            maxMp: 30,

            def: 8,
            gold: 50,
            materials: { herb: 2, magic_flower: 1, slime_gel: 3, iron_ore: 0, shadow_essence: 0, dragonshell: 0 },

        };

        let currentBattle = null;

        function getAvatarSVG(raceKey, classKey, isLarge = false) {
            const race = RACES[raceKey] || RACES.human;

            // Ears SVG part
            const earsSvg = race.ears === 'pointed' ? `<path d="M 12 28 L 4 24 L 16 32 Z M 52 28 L 60 24 L 48 32 Z" fill="${race.color}" />` : `<circle cx="14" cy="30" r="4" fill="${race.color}" /><circle cx="50" cy="30" r="4" fill="${race.color}" />`;

            // Weapon SVG part
            let weaponSvg = '';
            if (classKey === 'warrior') weaponSvg = `<path d="M 48 20 L 58 10 L 62 14 L 52 24 Z M 46 22 L 52 28" stroke="#CBD5E1" stroke-width="3" fill="none" />`;
            else if (classKey === 'mage') weaponSvg = `<path d="M 50 40 L 56 12" stroke="#78350F" stroke-width="3" /><circle cx="56" cy="12" r="5" fill="#3B82F6" />`;
            else if (classKey === 'rogue') weaponSvg = `<path d="M 48 30 L 58 20 L 54 18 Z" fill="#94A3B8" />`;
            else if (classKey === 'priest') weaponSvg = `<path d="M 50 40 L 54 16" stroke="#78350F" stroke-width="3" /><circle cx="54" cy="16" r="6" fill="#F59E0B" />`;

            return `
            <svg class="${size} pixelated transition-all" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Shadow -->
                <ellipse cx="32" cy="58" rx="20" ry="4" fill="#000" opacity="0.4" />
                <!-- Ears -->
                ${earsSvg}
                <!-- Head -->
                <rect x="20" y="18" width="24" height="24" rx="4" fill="${race.color}" />
                <!-- Eyes -->
                <rect x="26" y="26" width="3" height="5" fill="#1E293B" />
                <rect x="35" y="26" width="3" height="5" fill="#1E293B" />
                <!-- Horns -->
                ${hornsSvg}
                <!-- Body / Armor -->
                <rect x="22" y="40" width="20" height="18" rx="2" fill="#334155" />
                <rect x="26" y="42" width="12" height="14" fill="#475569" />

                ${weaponSvg}

        }

        function getMonsterSVG(type) {
            if (type === 'slime') {
                return `<svg class="w-24 h-24 pixelated animate-bounce" viewBox="0 0 64 64"><path d="M 12 48 Q 8 24 32 20 Q 56 24 52 48 Q 32 56 12 48 Z" fill="#22C55E"/><circle cx="24" cy="36" r="3" fill="#FFF"/><circle cx="40" cy="36" r="3" fill="#FFF"/><circle cx="25" cy="36" r="1" fill="#000"/><circle cx="41" cy="36" r="1" fill="#000"/></svg>`;
            } else if (type === 'plant') {
                return `<svg class="w-24 h-24 pixelated" viewBox="0 0 64 64"><circle cx="32" cy="28" r="16" fill="#A855F7"/><path d="M 32 44 L 32 60 M 24 50 L 32 55 M 40 50 L 32 55" stroke="#15803D" stroke-width="4"/><circle cx="26" cy="26" r="2" fill="#000"/><circle cx="38" cy="26" r="2" fill="#000"/></svg>`;
            } else if (type === 'goblin') {
                return `<svg class="w-24 h-24 pixelated" viewBox="0 0 64 64"><rect x="20" y="20" width="24" height="24" fill="#65A30D"/><rect x="18" y="42" width="28" height="18" fill="#78350F"/><rect x="24" y="28" width="4" height="4" fill="#EF4444"/><rect x="36" y="28" width="4" height="4" fill="#EF4444"/></svg>`;
            } else if (type === 'ghost') {
                return `<svg class="w-24 h-24 pixelated opacity-80" viewBox="0 0 64 64"><path d="M 16 20 Q 32 8 48 20 L 48 52 L 40 44 L 32 52 L 24 44 L 16 52 Z" fill="#6366F1"/><circle cx="26" cy="26" r="3" fill="#000"/><circle cx="38" cy="26" r="3" fill="#000"/></svg>`;
            } else {
                return `<svg class="w-28 h-28 pixelated" viewBox="0 0 64 64"><path d="M 12 36 Q 32 10 52 36 L 44 56 L 20 56 Z" fill="#B91C1C"/><path d="M 8 20 L 20 30 L 12 40 Z M 56 20 L 44 30 L 52 40 Z" fill="#7F1D1D"/><circle cx="24" cy="32" r="3" fill="#F59E0B"/><circle cx="40" cy="32" r="3" fill="#F59E0B"/></svg>`;
            }
        }

        window.onload = function() {
            AudioFX.init();
            loadGame();
            if (!player.created) {
                showCharacterCreation();
            } else {
                initMainUI();
            }
        };

        function saveGame() {
            localStorage.setItem('eldoria_player_save', JSON.stringify(player));
        }

        function loadGame() {
            const save = localStorage.getItem('eldoria_player_save');
            if (save) {
                try {
                    player = JSON.parse(save);
                } catch(e) {}
            }
        }

        function updateTopBar() {
            if (!player.created) return;
            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            document.getElementById('player-name-display').innerText = player.name;
            
            const className = player.promotedClass ? player.promotedClass.name : CLASSES[player.class].name;
            document.getElementById('player-class-display').innerText = `${RACES[player.race].name} • ${className}`;
            document.getElementById('gold-display').innerText = player.gold;
            document.getElementById('level-display').innerText = player.level;
            document.getElementById('player-head-icon').innerHTML = getAvatarSVG(player.race, player.class);

            // Check promotion availability for notice
            if (player.level >= 15 && !player.promotedClass) {
                document.getElementById('guild-notice').classList.remove('hidden');
            } else {
                document.getElementById('guild-notice').classList.add('hidden');

            let selClass = 'warrior';

                        <!-- Avatar Preview -->
                        <div class="p-4 bg-gray-900 border-2 border-fantasy-gold rounded-lg flex flex-col items-center gap-2 w-full">
                            <div id="avatar-preview-box">${getAvatarSVG(selRace, selClass, true)}</div>
                            <input type="text" id="hero-name-input" placeholder="ตั้งชื่อฮีโร่ของคุณ" value="${player.name}" class="bg-gray-800 border border-gray-700 text-center px-3 py-1.5 rounded text-amber-300 font-bold w-full max-w-xs focus:outline-none focus:border-amber-500">
                        </div>

                        <!-- Race Selection -->
                        <div class="w-full">
                            <label class="block text-xs font-bold text-amber-400 mb-1">เลือกเผ่าพันธุ์ (Race)</label>
                            <div class="grid grid-cols-3 gap-1.5 text-xs">
                                ${Object.keys(RACES).map(r => `
                                    <button onclick="selectRace('${r}')" class="p-2 border rounded text-center transition ${selRace === r ? 'bg-amber-600/30 border-amber-400 text-amber-300 font-bold' : 'bg-gray-900 border-gray-800 text-gray-400'}">
                                        ${RACES[r].name}
                                    </button>
                                `).join('')}
                            </div>
                            <p class="text-[11px] text-gray-400 mt-1 italic">${RACES[selRace].desc}</p>

                        <!-- Class Selection -->

                            <label class="block text-xs font-bold text-amber-400 mb-1">เลือกสายอาชีพ (Class)</label>
                            <div class="grid grid-cols-2 gap-2 text-xs">
                                ${Object.keys(CLASSES).map(c => `
                                    <button onclick="selectClass('${c}')" class="p-2 border rounded flex items-center gap-2 transition ${selClass === c ? 'bg-amber-600/30 border-amber-400 text-amber-300 font-bold' : 'bg-gray-900 border-gray-800 text-gray-400'}">
                                        <span class="text-base">${CLASSES[c].icon}</span>
                                        <div class="text-left">
                                            <div>${CLASSES[c].name}</div>
                                        </div>
                                    </button>

                        <button onclick="confirmCharacter()" class="w-full py-3 bg-gradient-to-r from-amber-600 to-yellow-500 text-black font-bold text-base rounded shadow-lg active:scale-95 transition mt-2">
                            เริ่มผจญภัยใน Eldoria
                        </button>
                    </div>
                `;
            }

            window.selectRace = function(r) {
                sfx('click');
                selRace = r;
                renderCreation();
            };

            window.selectClass = function(c) {
                sfx('click');
                selClass = c;
                renderCreation();
            };

            window.confirmCharacter = function() {
                sfx('victory');
                const nameInput = document.getElementById('hero-name-input').value.trim();
                player.name = nameInput || 'วีรบุรุษไร้นาม';
                player.race = selRace;
                player.class = selClass;
                
                // Recalculate Base Stats
                const raceData = RACES[selRace];
                const classData = CLASSES[selClass];

                player.maxHp = classData.baseHp + raceData.hpBonus;
                player.hp = player.maxHp;
                player.maxMp = classData.baseMp + raceData.mpBonus;
                player.mp = player.maxMp;
                player.atk = classData.atk + raceData.atkBonus;
                player.def = classData.def + raceData.defBonus;
                player.created = true;

                saveGame();
                initMainUI();
            };

            renderCreation();
        }

        function initMainUI() {
            updateTopBar();
            switchTab('adventure');
        }

        function switchTab(tab) {
            sfx('click');
            activeTab = tab;
            
            // Highlight active navigation tab button
            ['adventure', 'hero', 'crafting', 'guild', 'inventory'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tab) {
                    btn.className = 'flex flex-col items-center justify-center p-1 active-tab';
                } else {
                    btn.className = 'flex flex-col items-center justify-center p-1 text-gray-400';
                }

            if (tab === 'adventure') renderAdventureTab(main);
            else if (tab === 'hero') renderHeroTab(main);

            else if (tab === 'guild') renderGuildTab(main);
            else if (tab === 'inventory') renderInventoryTab(main);

            container.innerHTML = `

                        <h2 class="text-xl font-bold text-gray-100">ป่าทมิฬเอลดอเรีย</h2>
                        <p class="text-xs text-gray-400 mt-1">ออกสำรวจเพื่อค้นหาสมบัติ สู้กับมอนสเตอร์ หรือเผชิญหน้ากับเหตุการณ์สุ่ม!</p>

        function triggerExplore() {

                triggerRandomEvent();
            } else {
                // Spawn Battle
                startBattle();
            }
        }

        function triggerRandomEvent() {
            const events = ['shrine', 'chest', 'fountain', 'ambush'];
            const ev = events[Math.floor(Math.random() * events.length)];

            if (ev === 'shrine') {
                showModal(`
                    <div class="text-center">
                        <div class="text-3xl mb-2">🗿</div>
                        <h3 class="text-base font-bold text-amber-400 mb-2">ศิลาโบราณศักดิ์สิทธิ์</h3>
                        <p class="text-xs text-gray-300 mb-4">คุณพบศิลาโบราณส่องแสงสว่างไสว เลือกรับพรเพื่อเพิ่มค่าสถานะถาวร!</p>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <button onclick="applyBuff('atk')" class="p-2 bg-gray-800 border border-amber-500/50 rounded text-amber-300 font-bold">+2 ATK ถาวร</button>

            } else if (ev === 'chest') {
                showModal(`
                    <div class="text-center">
                        <div class="text-3xl mb-2">🎁</div>
                        <h3 class="text-base font-bold text-amber-400 mb-2">หีบสมบัติลึกลับ</h3>
                        <p class="text-xs text-gray-300 mb-4">คุณพบหีบสมบัติเก่าแก่ คุณจะเสี่ยงเปิดมันหรือไม่?</p>

                        </div>
                    </div>
                `);
            } else if (ev === 'fountain') {
                sfx('heal');
                player.hp = player.maxHp;
                player.mp = player.maxMp;

                showModal(`

                        <div class="text-3xl mb-2">⛲</div>

                        <p class="text-xs text-gray-300 mb-4">คุณได้ดื่มน้ำพุอันบริสุทธิ์ พลังชีวิต (HP) และมานา (MP) ฟื้นฟูเต็มสมบูรณ์!</p>
                        <button onclick="closeModal()" class="w-full py-2 bg-blue-600 text-white font-bold rounded">ตกลง</button>
                    </div>
                `);
            } else if (ev === 'ambush') {
                showModal(`
                    <div class="text-center">
                        <div class="text-3xl mb-2">⚠️</div>
                        <h3 class="text-base font-bold text-red-500 mb-2">รังมอนสเตอร์ซุ่มโจมตี!</h3>
                        <p class="text-xs text-gray-300 mb-4">ศัตรูพุ่งออกมาจากเงามืดอย่างรวดเร็ว!</p>
                        <button onclick="closeModal(); startBattle();" class="w-full py-2 bg-red-600 text-white font-bold rounded">เข้าสู่การต่อสู้!</button>
                    </div>
                `);
            }
        }

        window.applyBuff = function(type) {
            sfx('heal');
            if (type === 'atk') player.atk += 2;

            closeModal();
            renderAdventureTab(document.getElementById('main-content'));

        window.openChest = function() {
            if (Math.random() < 0.3) {
                // Mimic
                showModal(`
                    <div class="text-center">
                        <div class="text-3xl mb-2">👾</div>
                        <h3 class="text-base font-bold text-red-500 mb-2">กับดัก! กล่องกลืนวิญญาณ (Mimic)</h3>

                    </div>

                const goldEarned = Math.floor(Math.random() * 40) + 20;
                player.gold += goldEarned;
                player.materials.iron_ore = (player.materials.iron_ore || 0) + 1;

            let mData = MONSTERS[Math.floor(Math.random() * (MONSTERS.length - 1))];

                mData = { name: 'กล่องมิมิก', hp: 100, maxHp: 100, atk: 20, def: 5, exp: 50, gold: 60, drops: { iron_ore: 1 }, svgType: 'goblin' };

                monster: JSON.parse(JSON.stringify(mData)),
                log: [`เผชิญหน้ากับ ${mData.name}!`]
            };

            renderBattleUI(document.getElementById('main-content'));
        }

            const m = currentBattle.monster;
            const mHpPercent = Math.max(0, Math.floor((m.hp / m.maxHp) * 100));
            const pHpPercent = Math.max(0, Math.floor((player.hp / player.maxHp) * 100));
            const pMpPercent = Math.max(0, Math.floor((player.mp / player.maxMp) * 100));

                    </div>

                    <!-- Player Health & Mana Status -->
                    <div class="p-2 bg-gray-900 border border-fantasy-border rounded-lg text-xs">
                        <div class="flex justify-between text-gray-300 mb-1 font-bold">
                            <span>${player.name}</span>
                            <span>HP: ${player.hp}/${player.maxHp} | MP: ${player.mp}/${player.maxMp}</span>
                        </div>
                        <!-- Player HP Bar -->
                        <div class="w-full bg-gray-800 h-2.5 rounded-full overflow-hidden border border-gray-700 mb-1">
                            <div class="bg-green-600 h-full transition-all duration-300" style="width: ${pHpPercent}%"></div>
                        </div>
                        <!-- Player MP Bar -->
                        <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden border border-gray-700">
                            <div class="bg-blue-600 h-full transition-all duration-300" style="width: ${pMpPercent}%"></div>

                    </div>

                        <div class="grid grid-cols-3 gap-1.5">
                            <button onclick="executeAction('attack')" class="p-2 bg-red-900/80 hover:bg-red-800 border border-red-600 rounded text-red-200 font-bold active:scale-95 transition flex items-center justify-center gap-1">
                                <span>⚔️</span> โจมตี

        function executeAction(action) {
            if (!currentBattle) return;
            const m = currentBattle.monster;
            player.defending = false;

            let logMsg = '';

            if (action === 'attack') {
                sfx('attack');
                const dmg = Math.max(1, player.atk - m.def + Math.floor(Math.random() * 4));
                m.hp -= dmg;
                logMsg = `คุณโจมตี ${m.name} สร้างความเสียหาย ${dmg} หน่วย`;
            } else if (action === 'defend') {
                sfx('click');
                player.defending = true;
                logMsg = `คุณตั้งการ์ดป้องกัน ลดความเสียหายในเทิร์นถัดไป 50%`;
            } else if (action === 'meditate') {
                sfx('heal');
                const restored = Math.floor(player.maxMp * 0.2);
                player.mp = Math.min(player.maxMp, player.mp + restored);
                logMsg = `คุณนั่งสมาธิ ฟื้นฟู MP ${restored} หน่วย`;
            } else if (action === 'racial' || action === 'racial_2') {
                const skIdx = action === 'racial' ? 0 : 1;
                const sk = RACIAL_SKILLS[player.race][skIdx];
                if (player.mp < sk.mp) {
                    currentBattle.log.push(`MP ไม่พอสำหรับใช้ ${sk.name}!`);
                    renderBattleUI(document.getElementById('main-content'));
                    return;
                }
                sfx('magic');
                player.mp -= sk.mp;
                if (sk.pow) {
                    const dmg = Math.max(1, Math.floor(player.atk * sk.pow) - m.def);
                    m.hp -= dmg;
                    logMsg = `คุณใช้ [${sk.name}] ใส่ ${m.name} สร้างความเสียหาย ${dmg} หน่วย`;
                }
                if (sk.healPercent) {
                    const h = Math.floor(player.maxHp * sk.healPercent);
                    player.hp = Math.min(player.maxHp, player.hp + h);
                    logMsg += ` และฟื้นฟู HP ${h} หน่วย`;
                }
                if (sk.restoreMpPercent) {
                    const rMp = Math.floor(player.maxMp * sk.restoreMpPercent);
                    player.mp = Math.min(player.maxMp, player.mp + rMp);
                    logMsg = `คุณใช้ [${sk.name}] ฟื้นฟู MP ${rMp} หน่วย`;
                }
            } else if (action === 'promotion') {
                const sk = player.promotedClass.skill;
                if (player.mp < sk.mp) {
                    currentBattle.log.push(`MP ไม่พอสำหรับใช้ ${sk.name}!`);
                    renderBattleUI(document.getElementById('main-content'));
                    return;
                }
                sfx('magic');
                player.mp -= sk.mp;
                const dmg = Math.max(1, Math.floor(player.atk * sk.pow) - m.def);
                m.hp -= dmg;
                logMsg = `คุณใช้ท่าไม้ตาย [${sk.name}] ใส่ ${m.name} สร้างความเสียหาย ${dmg} หน่วย!`;

                if (sk.lifesteal) {
                    const steal = Math.floor(dmg * sk.lifesteal);
                    player.hp = Math.min(player.maxHp, player.hp + steal);
                    logMsg += ` (สูบเลือด ${steal} HP)`;
                }
                if (sk.healPercent) {
                    const h = Math.floor(player.maxHp * sk.healPercent);
                    player.hp = Math.min(player.maxHp, player.hp + h);
                    logMsg += ` (ฟื้นฟู ${h} HP)`;
                }
            }

            currentBattle.log.push(logMsg);

            // Check Monster Death
            if (m.hp <= 0) {
                m.hp = 0;
                sfx('victory');
                player.gold += m.gold;
                player.exp += m.exp;

                // Handle Material Drops
                let dropMsg = '';
                if (m.drops) {
                    Object.keys(m.drops).forEach(mat => {
                        if (Math.random() <= m.drops[mat]) {
                            player.materials[mat] = (player.materials[mat] || 0) + 1;
                            dropMsg += ` ได้รับ ${mat} x1!`;
                        }
                    });
                }

                currentBattle.log.push(`ชนะการต่อสู้! ได้รับ ${m.gold}G และ ${m.exp} EXP!${dropMsg}`);

                // Check Level Up
                checkLevelUp();
                saveGame();
                updateTopBar();

                setTimeout(() => {
                    currentBattle = null;
                    renderAdventureTab(document.getElementById('main-content'));
                }, 1800);
                return;
            }

            // Enemy Turn Attack
            setTimeout(() => {
                let mDmg = Math.max(1, m.atk - player.def + Math.floor(Math.random() * 3));
                if (player.defending) mDmg = Math.max(1, Math.floor(mDmg * 0.5));

                player.hp -= mDmg;
                sfx('attack');
                currentBattle.log.push(`${m.name} โจมตีคุณ สร้างความเสียหาย ${mDmg} หน่วย`);

                if (player.hp <= 0) {
                    player.hp = 0;
                    sfx('gameover');
                    currentBattle.log.push(`คุณถูกพ่ายแพ้...`);
                    saveGame();
                    setTimeout(() => {
                        showGameOverModal();
                    }, 1200);
                }

                renderBattleUI(document.getElementById('main-content'));
            }, 600);

            renderBattleUI(document.getElementById('main-content'));
        }

        function checkLevelUp() {
            if (player.exp >= player.maxExp) {
                player.level += 1;
                player.exp -= player.maxExp;
                player.maxExp = Math.floor(player.maxExp * 1.4);
                player.maxHp += 15;
                player.hp = player.maxHp;
                player.maxMp += 10;
                player.mp = player.maxMp;
                player.atk += 3;
                player.def += 2;
                currentBattle.log.push(`🌟 เลเวลอัปเป็น Lv.${player.level}! ค่าสถานะเพิ่มขึ้น!`);
            }

                    <div class="p-3 bg-gray-900 border border-fantasy-border rounded-lg text-center">
                        <h3 class="text-base font-bold text-amber-400">🎒 กระเป๋าเดินทาง</h3>
                        <p class="text-xs text-gray-400">จัดการไอเทมใช้งานและอุปกรณ์สวมใส่</p>
                    </div>

                    ${player.inventory.length === 0 ? `
                        <div class="p-8 text-center text-xs text-gray-500 border border-dashed border-gray-800 rounded-lg">
                            กระเป๋าว่างเปล่า ออกผจญภัยหรือคราฟต์เพื่อรับไอเทม!
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 gap-2">
                            ${player.inventory.map((item, idx) => `
                                <div class="p-2.5 bg-gray-900 border border-gray-800 rounded flex justify-between items-center text-xs">
                                    <div>
                                        <div class="font-bold text-amber-200">${item.item}</div>
                                        <div class="text-[10px] text-gray-400">${item.desc}</div>
                                    </div>
                                    <button onclick="useInventoryItem(${idx})" class="px-3 py-1 bg-green-700 hover:bg-green-600 text-white font-bold rounded text-[11px]">
                                        ใช้งาน
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        window.useInventoryItem = function(index) {
            const item = player.inventory[index];
            if (!item) return;

            sfx('heal');
            if (item.item.includes('HP')) {
                player.hp = Math.min(player.maxHp, player.hp + 100);
            } else if (item.item.includes('MP')) {
                player.mp = Math.min(player.maxMp, player.mp + 80);
            } else if (item.atk) {
                player.atk += item.atk;
            } else if (item.def) {
                player.def += item.def;
            }

            player.inventory.splice(index, 1);
            saveGame();
            renderInventoryTab(document.getElementById('main-content'));
        };

        function showModal(htmlContent) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.innerHTML = htmlContent;
            container.classList.remove('hidden');
        }

        function closeModal() {
            sfx('click');
            document.getElementById('modal-container').classList.add('hidden');
        }
    </script>
</body>
</html>
